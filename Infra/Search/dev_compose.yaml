name: zmunshaw

services:
  # Backend Service
  zacharymunshaw:
    image: site-backend:${ENVIRONMENT:-dev}
    restart: always
    hostname: zacharymunshaw-${ENVIRONMENT:-dev}
    build:
      context: ../../
      dockerfile: ./Infra/${ENVIRONMENT:-dev}/Search_Dockerfile
    environment:
      SE_DB_CONN: "host=${SE_DB_HOST:-se-db};port=${SE_DB_PORT:-5433};database=${SE_DB_NAME:-search};username=${SE_DB_USER:-postgres};password=${SE_DB_PASS:-postgres};"
      SITE_DB_CONN: "host=${SITE_DB_HOST:-site-db};port=${SITE_DB_PORT:-5432};database=${SITE_DB_NAME:-site};username=${SITE_DB_USER:-postgres};password=${SITE_DB_PASS:-postgres};"
      AI_ENDPOINT: ${AI_ENDPOINT:-http://local-ai:8080/v1}
      AI_DENSE_MODEL: ${AI_DENSE_MODEL:-granite-embedding-278m-multilingual}
      AI_SPARSE_MODEL: ${AI_SPARSE_MODEL:-text-embedding-splade-v3}
      SAFE_MODE: ${SAFE_MODE:-true}
      WIPE_ON_START: ${WIPE_ON_START:-false}
      MIGRATE: ${MIGRATE:-false}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Development}
      API_PORT: ${API_PORT:-2125}
    volumes:
      - ../../SiteBackend/Data/SeedData:/app/data
    ports:
      - "${API_PORT:-2125}:${API_PORT:-2125}"
    networks:
      - tunnel-net
      - be-net
      - db-net
      - cache-net
      - core-be-net
    profiles:
      - dev
      - prod
  
  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-${ENVIRONMENT:-dev}
    restart: always
    entrypoint: cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN}
    networks:
      - tunnel-net
    profiles:
      - dev
      - prod
  
  # Site Database
  site-db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: site-db-${ENVIRONMENT:-dev}
    restart: always
    command: -p ${SITE_DB_PORT:-5432}
    ports:
      - "${SITE_DB_PORT:-5432}:${SITE_DB_PORT:-5432}"
    environment:
      POSTGRES_DB: ${SITE_DB_NAME:-site}
      POSTGRES_USER: ${SITE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SITE_DB_PASS:-postgres}
    volumes:
      - site-db-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SITE_DB_USER:-postgres} -d ${SITE_DB_NAME:-site}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod
  
  # Search Engine Database (with pgvector)
  se-db:
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg16}
    container_name: se-db-${ENVIRONMENT:-dev}
    restart: always
    command: -p ${SE_DB_PORT:-5433}
    ports:
      - "${SE_DB_PORT:-5433}:${SE_DB_PORT:-5433}"
    environment:
      POSTGRES_DB: ${SE_DB_NAME:-search}
      POSTGRES_USER: ${SE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SE_DB_PASS:-postgres}
    volumes:
      - se-db-data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SE_DB_USER:-postgres} -d ${SE_DB_NAME:-search}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod
  
  # Crawler Service
  crawler:
    image: crawler:${ENVIRONMENT:-dev}
    restart: always
    hostname: crawler-${ENVIRONMENT:-dev}
    build:
      context: ../../Workers/go-spider
      dockerfile: Dockerfile
    ports:
      - "${CRAWLER_PORT:-9900}:9900"
    networks:
      - be-net
    profiles:
      - dev
      - prod

networks:
  tunnel-net:
    driver: bridge
    name: zm-${ENVIRONMENT:-dev}-tunnel-net
  db-net:
    driver: bridge
    name: zm-${ENVIRONMENT:-dev}-db-net
  be-net:
    driver: bridge
    name: zm-${ENVIRONMENT:-dev}-be-net
  cache-net:
    driver: bridge
    name: zm-${ENVIRONMENT:-dev}-cache-net
  core-be-net:
    external: true
    name: core-be-net

volumes:
  site-db-data:
    name: zm-${ENVIRONMENT:-dev}-site-db-data
  se-db-data:
    name: zm-${ENVIRONMENT:-dev}-se-db-data